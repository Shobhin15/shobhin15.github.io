name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Lint HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate markup
        run: npx --yes html-validate@8 site/

  container-smoke-test:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t portfolio:${{ github.sha }} .
      - name: Run container
        run: docker run -d --name portfolio -p 8080:80 portfolio:${{ github.sha }}
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/ | grep -q "Shobhin Gowrisankar"; then
              echo "Smoke test passed"; exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed"; docker logs portfolio; exit 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [validate, container-smoke-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
