apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "portfolio.fullname" . }}-test-connection"
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - wget -qO- http://{{ include "portfolio.fullname" . }}:{{ .Values.service.port }}/ | grep -q "Shobhin Gowrisankar"
